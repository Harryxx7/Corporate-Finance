<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>章节目录 — 公司理财笔记</title>
<style>
  :root {
    --bg: #faf8f3;
    --card: #ffffff;
    --ink: #2a2620;
    --muted: #6f675d;
    --rule: #e0ddd3;
    --accent: #4a6b4f;
    --accent-soft: #dde6da;
    --warn: #a04830;
    --gold: #a07a3c;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, "PingFang SC", "Source Han Serif SC", "Noto Serif CJK SC", "Microsoft YaHei", serif;
    line-height: 1.7;
  }

  main {
    width: min(920px, calc(100% - 32px));
    margin: 0 auto;
    padding: 48px 0 64px;
  }

  .top-link {
    display: inline-flex;
    align-items: center;
    color: var(--accent);
    text-decoration: none;
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 24px;
  }

  h1 {
    margin: 0;
    font-size: clamp(30px, 5vw, 48px);
    line-height: 1.15;
    letter-spacing: 0;
  }

  .lead {
    margin: 14px 0 32px;
    color: var(--muted);
    font-size: 17px;
  }

  .chapter-list {
    display: grid;
    gap: 14px;
  }

  .chapter-card {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 16px;
    align-items: center;
    padding: 20px 22px;
    background: var(--card);
    border: 1px solid var(--rule);
    border-left: 4px solid var(--accent);
    border-radius: 8px;
    text-decoration: none;
    color: inherit;
  }

  .chapter-card:hover {
    border-left-color: var(--gold);
    background: #fffdf8;
  }

  .chapter-title {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 12px;
    align-items: baseline;
    margin: 0 0 4px;
    font-size: 21px;
    font-weight: 800;
  }

  .chapter-title .en {
    color: var(--muted);
    font-size: 14px;
    font-weight: 600;
  }

  .desc {
    margin: 0;
    color: var(--muted);
    font-size: 15px;
  }

  .status {
    white-space: nowrap;
    border-radius: 999px;
    padding: 5px 10px;
    font-size: 13px;
    font-weight: 800;
    background: var(--accent-soft);
    color: var(--accent);
  }

  .status.todo {
    background: #f0d8cd;
    color: var(--warn);
  }

  @media (max-width: 620px) {
    main { padding-top: 32px; }

    .chapter-card {
      grid-template-columns: 1fr;
      padding: 18px;
    }

    .status {
      width: max-content;
    }
  }
</style>
</head>
<body>
<main>
  <a class="top-link" href="../index.html">返回总笔记</a>

  <h1>公司理财章节目录</h1>
  <p class="lead">按章节进入对应学习页。当前第二章仍是占位内容，复习重点先放在已录入章节。</p>

  <div class="chapter-list" aria-label="章节列表">
    <a class="chapter-card" href="ch1_实物期权.html">
      <div>
        <p class="chapter-title">一、实物期权 <span class="en">Real Options</span></p>
        <p class="desc">概念分类、放弃期权例题、含期权 NPV 与期权价值。</p>
      </div>
      <span class="status">已完成</span>
    </a>

    <a class="chapter-card" href="ch2_债券估值.html">
      <div>
        <p class="chapter-title">二、债券估值 <span class="en">Bond Valuation</span></p>
        <p class="desc">目前为占位页，正文知识点尚未录入。</p>
      </div>
      <span class="status todo">待录入</span>
    </a>

    <a class="chapter-card" href="ch3_股票估值.html">
      <div>
        <p class="chapter-title">三、股票估值 <span class="en">Stock Valuation</span></p>
        <p class="desc">DDM、NPVGO、PE、EV/EBITDA、PB、真题与考前速记。</p>
      </div>
      <span class="status">已完成</span>
    </a>

    <a class="chapter-card" href="ch4_现代资产组合理论.html">
      <div>
        <p class="chapter-title">四、现代资产组合理论 <span class="en">MPT</span></p>
        <p class="desc">收益与风险、组合方差、分散化、系统性风险、夏普比率与真题。</p>
      </div>
      <span class="status">已完成</span>
    </a>
  </div>
</main>
</body>
</html>
